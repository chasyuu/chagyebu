<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이 차계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="차계부">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0a1220;--bg2:#0f1a2d;--card:#14213a;--card2:#1a2a47;--line:#22375c;--text:#eef3fb;--sub:#8da2c3;--dim:#5f7396;--accent:#3fb8e6;--accent2:#1f7fd1;--ok:#34c38f;--warn:#f5b041;--bad:#ff5d5d;--kp:#3fb8e6;--kr:#f59e42;--ke:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text)}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.4px}
.brand span{color:var(--accent)}
.vsw{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;display:flex;gap:6px;align-items:center}
.hero{margin:8px 16px 0;border-radius:24px;padding:20px 20px 18px;background:radial-gradient(120% 90% at 85% 0%,#215591 0%,#132848 48%,#0d1a30 100%);border:1px solid #284672;position:relative;overflow:hidden}
.hero .model{color:var(--sub);font-size:13px}
.hero .name{font-size:23px;font-weight:800;letter-spacing:-.4px}
.plate{display:inline-block;margin-top:6px;background:#f4f6fa;color:#111;font-weight:700;border-radius:6px;padding:1px 9px;font-size:13px;letter-spacing:.5px}
.car{display:block;width:100%;height:auto;margin:2px 0 0}
.hero>*:not(.hero-img):not(.hero-shade){position:relative}
.hero.has-photo{background:#0b1424;min-height:300px;display:flex;flex-direction:column}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,12,22,.78) 0%,rgba(7,12,22,.15) 34%,rgba(7,12,22,.12) 58%,rgba(7,12,22,.9) 100%)}
.hero-gap{flex:1;min-height:120px}
.hero-cam{position:absolute!important;top:14px;right:14px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#dbe6f5;z-index:2}
.hero-cam svg{width:18px;height:18px}
.vprev{margin-top:12px;border-radius:16px;background:radial-gradient(120% 100% at 80% 0%,#1d4a80 0%,#122544 50%,#0d1a30 100%);border:1px solid #284672;padding:8px 10px;overflow:hidden;min-height:120px;display:grid;place-items:center}
.credit{display:block;font-size:10.5px;color:#9fb2cc;text-decoration:underline;margin-top:6px;text-align:right}
.credit.hc{position:absolute!important;right:16px;bottom:62px;margin:0;color:rgba(230,238,250,.75);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.credit.hc{max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wmres{margin-top:10px}
.wmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wmgrid button{aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--card)}
.wmgrid button.on{border-color:var(--accent)}
.wmgrid img{width:100%;height:100%;object-fit:cover;display:block}
.photorow{flex-wrap:wrap}
.vprev img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}
.mpick{position:relative}
.msug{display:none;position:absolute;left:0;top:100%;margin-top:4px;width:min(320px,calc(100vw - 48px));background:var(--card2);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30;overflow:hidden}
.msug.on{display:block}
.msug button{display:block;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}
.msug button:last-child{border-bottom:0}
.msug button:hover{background:rgba(63,184,230,.08)}
.msug b{display:block;font-size:14px}.msug span{font-size:12px;color:var(--sub)}
.mbadge{margin:0 0 10px;padding:9px 12px;border-radius:12px;background:rgba(63,184,230,.1);border:1px solid rgba(63,184,230,.3);font-size:13px;color:#bfe9fb}
.mbadge span{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.mbadge b{color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.swatches button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2),inset 0 0 0 1px rgba(255,255,255,.25)}
.swatches input[type=color]{width:34px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.seg3{grid-template-columns:repeat(3,1fr)!important}
.photorow{display:flex;gap:8px;margin-top:10px}
.photorow .btn{flex:1 1 30%;min-height:40px;padding:8px 10px}
.vthumb{width:64px;height:40px;border-radius:9px;overflow:hidden;flex:none;background:#0d1a30;display:grid;place-items:center}
.vthumb img{width:100%;height:100%;object-fit:cover}.vthumb svg{width:100%}
.odo{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.odo .l{font-size:12px;color:var(--sub)}
.odo .v{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.odo .v small{font-size:15px;color:var(--sub);font-weight:500;margin-left:3px}
.btn{border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.danger{background:rgba(255,93,93,.12);color:var(--bad);border:1px solid rgba(255,93,93,.3)}
.btn.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.sec{margin:24px 16px 0}
.sec>h3{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.2px}
.sec>h3 a,.link{font-size:13px;color:var(--accent);font-weight:500;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer}
.st b{display:block;font-size:22px;font-weight:800}
.st span{font-size:12px;color:var(--sub)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 4px 11px;text-align:center;font-size:12px;line-height:1.3}
.qa .ic{width:40px;height:40px;border-radius:13px;margin:0 auto 7px;display:grid;place-items:center}
.qa .ic svg{width:21px;height:21px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini2 .card .l{font-size:12px;color:var(--sub)}
.mini2 .card .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.bar{height:7px;background:#0b1526;border-radius:5px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:5px}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap}
.chip.ok{background:rgba(52,195,143,.14);color:var(--ok)}
.chip.warn{background:rgba(245,176,65,.15);color:var(--warn)}
.chip.bad{background:rgba(255,93,93,.15);color:var(--bad)}
.chip.none{background:rgba(141,162,195,.14);color:var(--sub)}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}
.item .nm{font-weight:700;font-size:15.5px}
.item .cy{font-size:12px;color:var(--dim);margin-top:1px}
.item .meta{font-size:12.5px;color:var(--sub);margin-top:8px;display:grid;gap:2px}
.item .meta b{color:var(--text);font-weight:500}
.item .acts{display:flex;gap:6px;margin-top:11px}
.item .acts .btn{flex:1}
.rem{font-size:12.5px;font-weight:700;margin-top:7px}
.list .rec{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid rgba(34,55,92,.6);cursor:pointer}
.list .rec:last-child{border-bottom:0}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t span{font-size:12px;color:var(--sub)}
.rec .amt{font-weight:700;white-space:nowrap}
.mhead{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin:18px 2px 4px}
.mhead b{color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:7px 13px;font-size:13px;white-space:nowrap}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#04121c;font-weight:700}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px;outline:none}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(10,17,31,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:7px 4px 10px;z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:4px 0}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:84px;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(31,127,209,.45);z-index:19}
.sheet-bg{position:fixed;inset:0;background:rgba(2,6,14,.6);display:none;z-index:50;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 18px 26px;border-top:1px solid var(--line);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h b{font-size:17px}
.x{width:32px;height:32px;border-radius:10px;background:var(--card);font-size:14px;color:var(--sub)}
.form label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
.form label span{color:var(--dim);font-size:11px;margin-left:3px}
.form input,.form select,.form textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;font-size:15px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent)}
.form input[type=date]{color-scheme:dark}
.form select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{padding:9px 0;border-radius:10px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card2);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.form .g-parts,.form .g-repair,.form .g-etc,.form .g-fuel,.form .g-wash{display:none}
.form.k-parts .g-parts,.form.k-repair .g-repair,.form.k-etc .g-etc,.form.k-fuel .g-fuel,.form.k-wash .g-wash{display:block}
.form.k-etc .g-nlabor,.form.k-fuel .g-nlabor,.form.k-wash .g-nlabor{display:none}
.form.k-etc .row2.costs,.form.k-fuel .row2.costs,.form.k-wash .row2.costs{grid-template-columns:1fr}
.form .lp-etc{display:none}.form.k-etc .lp-etc,.form.k-fuel .lp-etc,.form.k-wash .lp-etc{display:inline}.form.k-etc .lp-def,.form.k-fuel .lp-def,.form.k-wash .lp-def{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.daily .dh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.daily .big{font-size:15px;margin-top:6px}
.daily .big b{font-size:20px}
.dinput{display:flex;gap:8px;margin-top:10px}
.dinput input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.dinput input:focus{border-color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;align-items:end}
.week div{text-align:center;font-size:10.5px;color:var(--dim)}
.week i{display:block;margin:0 auto 4px;width:60%;border-radius:4px;background:var(--accent);min-height:3px}
.week .no i{background:#22375c}
.week .td{color:var(--text);font-weight:700}
.note.bell{background:rgba(63,184,230,.12);border-color:rgba(63,184,230,.4);color:#cfefff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pred{font-size:12.5px;color:var(--sub);margin-top:3px}
.pred b{color:var(--text);font-weight:700}
.tlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tlist span{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:5px 6px 5px 11px;font-size:13.5px}
.tlist span button{width:20px;height:20px;border-radius:7px;background:rgba(255,255,255,.08);font-size:11px;color:var(--sub)}
.switch{position:relative;width:46px;height:27px;border-radius:15px;background:#2a3d60;flex:none;transition:.2s}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:22px}
.syncb{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.syncb svg{width:19px;height:19px}
.syncb i{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;border:2px solid var(--card)}
.syncb.spin svg{animation:sp 1.2s linear infinite}
.topr{display:flex;gap:8px;align-items:center;min-width:0}
.gd .row{gap:12px}
.gd .acc{font-size:13px;color:var(--sub);margin-top:2px;word-break:break-all}
.loglist .row{padding:9px 0;border-bottom:1px solid rgba(34,55,92,.6);font-size:14px}
.loglist .row:last-child{border-bottom:0}
.sumline{display:flex;justify-content:space-between;margin-top:14px;padding:12px 14px;background:var(--card);border-radius:12px;font-size:14px;color:var(--sub)}
.sumline b{color:var(--text);font-size:17px}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1;padding:13px}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugs button{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:5px 10px;color:var(--sub);background:var(--card)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;font-size:14px;margin-top:6px}
.kv dt{color:var(--sub)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#e9f1fb;color:#0a1220;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
.yearsw{display:flex;align-items:center;gap:6px}
.yearsw button{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.yearsw b{font-size:17px;min-width:62px;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.hbar{margin:10px 0}
.hbar .row{font-size:13.5px}
.hbar .row span{color:var(--sub);font-size:12.5px}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:10px;background:#0b1526}
.note{margin:12px 16px 0;padding:11px 14px;border-radius:14px;font-size:13px;background:rgba(245,176,65,.1);border:1px solid rgba(245,176,65,.3);color:#f7cf8a}
.note.info{background:rgba(63,184,230,.08);border-color:rgba(63,184,230,.28);color:#a9dcf2}
textarea.io{width:100%;min-height:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;color:var(--sub);outline:none}
.vcard{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid rgba(34,55,92,.6)}
.vcard:last-child{border-bottom:0}
.vcard .on{color:var(--accent);font-size:11px;font-weight:700;margin-left:6px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--sub);gap:12px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--sub)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.welcome{margin:16px;padding:22px;border-radius:24px;background:radial-gradient(120% 90% at 85% 0%,#215591 0%,#132848 48%,#0d1a30 100%);border:1px solid #284672}
.welcome h2{font-size:21px;letter-spacing:-.4px}
.welcome p{color:var(--sub);font-size:14px;margin-top:4px}
/* ===== 폴더블 · 태블릿 대응 ===== */
.layout{display:block}
.col{min-width:0}
@media (max-width:360px){ /* 갤럭시 폴드 커버 화면 등 좁은 화면 */
  .top{padding:14px 14px 4px}.brand{font-size:17px}
  .hero{margin:6px 12px 0;padding:16px}.hero .name{font-size:20px}.odo .v{font-size:26px}
  .sec{margin:20px 12px 0}.status3{margin:10px 12px 0;gap:6px}
  .qa{font-size:11.5px;padding:11px 2px 9px}.qa .ic{width:36px;height:36px}
  .mini2 .card .v{font-size:16.5px}
  .seg button{font-size:12px}
  .tabbar button{font-size:10.5px}
  .vsw{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (min-width:600px){ /* 펼친 폴드 · 태블릿: 왼쪽 내비게이션 + 2단 */
  :root{--rail:84px}
  .app{max-width:none;padding:0 0 32px var(--rail)}
  .tabbar{top:0;bottom:0;left:0;transform:none;width:var(--rail);max-width:none;flex-direction:column;justify-content:center;gap:4px;border-top:0;border-right:1px solid var(--line);padding:0}
  .tabbar button{flex:none;padding:12px 0}

const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/DAY);

// all known odometer points (daily log + records + manual)
function points(v){
  const p=Object.entries(v.log||{}).map(([d,k])=>({d,k:+k}));
  vRecs(v).forEach(r=>{if(r.km>0)p.push({d:r.date,k:r.km})});
  if(v.odo&&v.odoDate)p.push({d:v.odoDate,k:+v.odo});
  return p.filter(x=>x.d&&x.k>0).sort((a,b)=>a.d.localeCompare(b.d)||a.k-b.k);
}
function kmAt(v,date){let m=null;points(v).forEach(p=>{if(p.d<=date&&(m===null||p.k>m))m=p.k});return m}
function lastPoint(v){const p=points(v);let best=null;p.forEach(x=>{if(!best||x.k>best.k||(x.k===best.k&&x.d>best.d))best=x});return best}
function avgDaily(v){
  const p=points(v);if(p.length<2)return null;
  const last=p[p.length-1].d;let w=p.filter(x=>dayDiff(x.d,last)<=60);
  if(w.length<2||dayDiff(w[0].d,last)<3)w=p;
  const days=dayDiff(w[0].d,last);if(days<1)return null;
  const mx=Math.max(...w.map(x=>x.k)),mn=Math.min(...w.map(x=>x.k));
  const avg=(mx-mn)/days;return avg>0?{avg,days}:null;
}
function dailyDeltas(v,n){
  const log=v.log||{};const out=[];
  for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);let val=null;
    if(log[d]!=null){const prev=Object.keys(log).filter(x=>x<d).sort().pop();if(prev)val=Math.max(0,log[d]-log[prev])}
    out.push({d,val,has:log[d]!=null})}
  return out;
}

async function processPhoto(file){
  const url=URL.createObjectURL(file);const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
  let max=1100,out='';
  for(let k=0;k<4;k++){
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    let q=.82;out=cv.toDataURL('image/jpeg',q);while(out.length>200000&&q>.5){q-=.08;out=cv.toDataURL('image/jpeg',q)}
    if(out.length<=200000)break;max=Math.round(max*.75);
  }
  URL.revokeObjectURL(url);return out;
}

function itemStatus(it,v){
  const recs=R.filter(r=>r.kind==='parts'&&r.itemId===it.id).sort(sortRec);
  const last=recs[0],odo=curOdo(v);
  const res={state:'none',ratio:0,last,count:recs.length,nextKm:null,nextDate:null,kmLeft:null,daysLeft:null};
  if(!last)return res;
  let rk=null,rt=null;
  if(it.cycleKm>0){res.nextKm=(last.km||0)+it.cycleKm;res.kmLeft=res.nextKm-odo;rk=(odo-(last.km||0))/it.cycleKm}
  if(it.cycleMonths>0){res.nextDate=addMonths(last.date,it.cycleMonths);const s=parseD(last.date).getTime(),e=parseD(res.nextDate).getTime(),n=parseD(today()).getTime();rt=(n-s)/Math.max(1,e-s);res.daysLeft=Math.round((e-n)/86400000)}
  res.ratio=Math.max(rk??0,rt??0);
  res.state=res.ratio>=1?'bad':res.ratio>=.85?'warn':'ok';
  // predicted date using average daily driving
  const cands=[];
  if(res.nextDate)cands.push(res.nextDate);
  const ad=avgDaily(v),lp=lastPoint(v);
  if(res.nextKm&&ad&&lp){const need=res.nextKm-lp.k;cands.push(addDays(lp.d,Math.max(0,Math.ceil(need/ad.avg))))}
  if(cands.length){res.predDate=cands.sort()[0];res.predDays=dayDiff(today(),res.predDate)}
  return res;
}

function remText(s){
  const p=[];
  if(s.kmLeft!==null)p.push(s.kmLeft>=0?`${fmt(s.kmLeft)}km 남음`:`${fmt(-s.kmLeft)}km 초과`);
  if(s.daysLeft!==null){const d=s.daysLeft;p.push(d>=0?(d>60?`약 ${Math.round(d/30)}개월 남음`:`${d}일 남음`):(-d>60?`${Math.round(-d/30)}개월 지남`:`${-d}일 지남`))}
  return p.join(' · ');
}
const predText=s=>{if(!s.predDate)return '';const d=s.predDays;return d<=0?'<b style="color:var(--bad)">지금 교체 시기</b>':`예상 교체일 <b>${dot(s.predDate)}</b> (${d>60?'약 '+Math.round(d/30)+'개월':d+'일'} 후)`};
const cycleText=it=>[it.cycleKm>0?`${fmt(it.cycleKm)}km`:'',it.cycleMonths>0?`${it.cycleMonths}개월`:''].filter(Boolean).join(' 또는 ')+' 주기';

function homeSums(v){
  const rs=vRecs(v),ym=today().slice(0,7),y=ym.slice(0,4);
  return {month:rs.filter(r=>String(r.date).startsWith(ym)).reduce((a,r)=>a+total(r),0),year:rs.filter(r=>String(r.date).startsWith(y)).reduce((a,r)=>a+total(r),0)};
}
function dueReminder(){
  const rm=S.reminder||{},v=V();if(!rm.on||!v||!(rm.times||[]).length)return null;
  if((v.log||{})[today()]!=null)return null;
  const n=new Date(),now=pad(n.getHours())+':'+pad(n.getMinutes());
  const passed=(rm.times||[]).filter(t=>t<=now).sort();
  return passed.length?passed[passed.length-1]:null;
}
function dailyCard(v){
  const t=today(),log=v.log||{},has=log[t]!=null,prevD=Object.keys(log).filter(x=>x<t).sort().pop();
  const prevK=prevD?log[prevD]:(lastPoint(v)||{}).k;
  const wk=dailyDeltas(v,7),mx=Math.max(1,...wk.map(x=>x.val||0));
  const ad=avgDaily(v);const d=new Date();
  return `<div class="sec"><div class="card daily" id="daily">
   <div class="dh"><span>오늘의 주행 · ${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})</span>${ad?`<span>하루 평균 <b style="color:var(--text)">${fmt(ad.avg)}km</b></span>`:''}</div>
   ${has?`<div class="big"><b>${fmt(log[t])}km</b> 입력 완료${prevD?` · <span style="color:var(--accent)">${dot(prevD).slice(5)} 대비 +${fmt(log[t]-log[prevD])}km</span>`:''}</div>`
   :`<div class="big">오늘 계기판 주행거리를 입력해 주세요</div>`}
   <div class="dinput"><input id="dkm" inputmode="numeric" placeholder="${prevK?'마지막 '+fmt(prevK)+'km':'예) 52,340'}" value="${has?fmt(log[t]):''}"><button class="btn primary" data-a="savedaily">${has?'수정':'저장'}</button></div>
   <div class="week">${wk.map((x,i)=>`<div class="${x.has?'':'no'} ${i===6?'td':''}"><i style="height:${x.val?Math.max(4,x.val/mx*46):3}px"></i>${x.val!=null?fmt(x.val):(x.has?'·':'–')}<br>${WD[parseD(x.d).getDay()]}</div>`).join('')}</div>
   ${ad?`<div class="hint" style="margin-top:10px">최근 ${ad.days}일 기준 월 약 ${fmt(ad.avg*30)}km 주행 · 이 값으로 소모품 예상 교체일을 계산해요</div>`:`<div class="hint" style="margin-top:10px">이틀 이상 기록하면 하루 평균 주행거리로 교체 예상일을 계산해요</div>`}
  </div></div>`;

const unitOf=(v=V())=>v&&v.fuel==='전기'?'kWh':'L';
function fuelEff(v){
  if(!v)return {};const f=vRecs(v).filter(r=>r.kind==='fuel'&&r.km>0).sort((a,b)=>a.km-b.km||a.date.localeCompare(b.date));
  const out={};let last=null,acc=0;
  f.forEach(r=>{if(last){acc+=Number(r.liters)||0;if(r.full){if(acc>0&&r.km>last.km)out[r.id]=(r.km-last.km)/acc;last=r;acc=0}}else if(r.full){last=r;acc=0}});
  return out;
}
function recRow(r){
  const k=KIND[kindOf(r)];
  const fe=r.kind==='fuel'?(fuelEff(V())[r.id]):null;
  const sub=[dot(r.date),r.km?fmt(r.km)+'km':'',r.kind==='fuel'&&r.liters?`${r.liters}${unitOf()}`:'',fe?`연비 ${fe.toFixed(1)}km/${unitOf()}`:'',(r.kind==='parts'||r.kind==='fuel')?'':(r.category!==r.title?r.category:''),r.shop].filter(Boolean).join(' · ');
  return `<div class="rec" data-a="recdetail" data-id="${esc(r.id)}"><div class="badge" style="background:${k.hex}22;color:${k.hex}">${k.short}</div>
  <div class="t"><b>${esc(r.title||k.full)}${r.spec?` <span style="color:var(--dim);font-size:12px">${esc(r.spec)}</span>`:''}</b><span>${esc(sub)}</span></div><div class="amt">${won(total(r))}</div></div>`;
}

function niceMax(m){if(m<=0)return 100000;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function chartSVG(months,sel){
  const W=340,H=180,pl=36,pr=4,pt=10,pb=24,ch=H-pt-pb;
  const msum=m=>KEYS.reduce((a,k)=>a+(m[k]||0),0);const max=niceMax(Math.max(0,...months.map(msum)));
  const bw=(W-pl-pr)/12;let s='';
  [0,.5,1].forEach(f=>{const y=pt+ch*(1-f);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#22375c" stroke-width="1" ${f?'stroke-dasharray="2 4"':''}/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#5f7396">${f?shortWon(max*f):'0'}</text>`});
  months.forEach((m,i)=>{
    const x=pl+i*bw+bw*.22,w=bw*.56;let y=pt+ch;
    const on=sel===i;
    KEYS.forEach(k=>{if(m[k]>0){const h=Math.max(1.5,ch*m[k]/max);y-=h;s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${KIND[k].hex}" opacity="${sel===null||on?1:.35}"/>`;y-=1}});
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${on?'#eef3fb':'#5f7396'}" font-weight="${on?700:400}">${i+1}</text>`;
    s+=`<rect x="${pl+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-a="smonth" data-m="${i}" style="cursor:pointer"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 지출 막대 차트">${s}</svg>`;
}
function monthDriven(v,y){
  return Array.from({length:12},(_,m)=>{
    const st=`${y}-${pad(m+1)}-01`,en=toISO(new Date(y,m+1,0));
    const e=kmAt(v,en);if(e===null)return 0;
    let b=kmAt(v,addDays(st,-1));
    if(b===null){const inM=points(v).filter(p=>p.d>=st&&p.d<=en);if(!inM.length)return 0;b=Math.min(...inM.map(p=>p.k))}
    return Math.max(0,e-b);
  });
}
function simpleBars(vals,hex,unit){
  const W=340,H=130,pl=36,pt=8,pb=22,ch=H-pt-pb,max=niceMax(Math.max(0,...vals)),bw=(W-pl-4)/12;let s='';
  [0,1].forEach(f=>{const y=pt+ch*(1-f);s+=`<line x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}" stroke="#22375c" ${f?'stroke-dasharray="2 4"':''}/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#5f7396">${f?(max>=10000?(max/10000)+'만':fmt(max)):'0'}</text>`});
  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.22,w=bw*.56,h=v?Math.max(1.5,ch*v/max):0;if(h)s+=`<rect x="${x}" y="${pt+ch-h}" width="${w}" height="${h}" rx="2" fill="${hex}"><title>${i+1}월 ${fmt(v)}${unit}</title></rect>`;s+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="#5f7396">${i+1}</text>`});

function syncOdo(v){const ks=Object.keys(v.log||{}).sort();if(ks.length){const last=ks[ks.length-1];v.odo=v.log[last];v.odoDate=last}}
function saveLog(date,km){
  const v=V();if(!date)return toast('날짜를 입력해 주세요'),false;if(!km)return toast('주행거리를 입력해 주세요'),false;
  v.log=v.log||{};const ks=Object.keys(v.log).sort();
  const prev=ks.filter(x=>x<date).pop(),next=ks.filter(x=>x>date)[0];
  if(prev&&km<v.log[prev])return toast(`${dot(prev)} 기록(${fmt(v.log[prev])}km)보다 작아요`),false;
  if(next&&km>v.log[next])return toast(`${dot(next)} 기록(${fmt(v.log[next])}km)보다 커요`),false;
  if(prev&&km-v.log[prev]>3000*Math.max(1,dayDiff(prev,date)))return toast('하루 주행거리가 너무 커요. 숫자를 확인해 주세요'),false;
  v.log[date]=km;syncOdo(v);saveGarage();render();if(date===today())pushDone(today());
  toast(prev?`저장했어요 · ${dot(prev).slice(5)} 대비 +${fmt(km-v.log[prev])}km`:'저장했어요');return true;
}

}

async function saveRecordFromForm(more){
  const f=$('#rf');if(!f)return;const fd=new FormData(f);const kind=fd.get('kind');
  const id=f.dataset.id||newId();const old=R.find(x=>x.id===id);const v=old?S.vehicles.find(x=>x.id===old.vehicleId)||V():V();
  const rec={id,vehicleId:v.id,kind,date:fd.get('date'),km:num(fd.get('km')),partCost:num(fd.get('partCost')),laborCost:(kind==='parts'||kind==='repair')?num(fd.get('laborCost')):0,shop:String(fd.get('shop')||'').trim(),memo:String(fd.get('memo')||'').trim(),createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()};
  if(!rec.date)return toast('작업일자를 입력해 주세요');
  if(kind==='parts'){const it=S.items.find(i=>i.id===fd.get('itemId'));if(!it)return toast('소모품 항목을 먼저 추가해 주세요');if(!rec.km)return toast('교체할 때의 주행거리를 입력해 주세요');rec.itemId=it.id;rec.title=it.name;rec.category='소모품';rec.spec=String(fd.get('spec')||'').trim()}
  else if(kind==='repair'){rec.category=fd.get('rcat');rec.title=String(fd.get('rtitle')||'').trim();rec.spec=String(fd.get('rspec')||'').trim();if(!rec.title)return toast('정비 내용을 입력해 주세요')}
  else if(kind==='fuel'){rec.category=fd.get('ftype');rec.title='주유';rec.liters=Number(String(fd.get('liters')||'').replace(/[^\d.]/g,''))||0;rec.unitPrice=num(fd.get('unitPrice'));rec.full=!!fd.get('full');if(!rec.partCost&&rec.liters&&rec.unitPrice)rec.partCost=Math.round(rec.liters*rec.unitPrice);if(!rec.partCost)return toast('주유 금액을 입력해 주세요')}
  else if(kind==='wash'){rec.category=fd.get('wtype');rec.title=String(fd.get('wtitle')||'').trim()||rec.category;if(!rec.partCost)return toast('세차 금액을 입력해 주세요')}
  else{rec.category=fd.get('ecat');rec.title=String(fd.get('etitle')||'').trim()||rec.category}
  const i=R.findIndex(x=>x.id===id);if(i>=0)R[i]=rec;else R.push(rec);
  if(rec.km>(Number(v.odo)||0)){v.odo=rec.km;v.odoDate=rec.date;saveGarage()}
  if(kind==='parts'&&!rec.km)rec.km=0;
  await persistRecord(rec);render();toast(old?'수정했어요':'저장했어요');
  if(more)openSheet(recordForm({kind,date:rec.date,km:rec.km,shop:rec.shop}));else closeSheet();
}

function addPresets(vid){
  const have=new Set(S.items.filter(i=>i.vehicleId===vid).map(i=>i.name));let n=0;
  PRESETS.forEach(([name,km,mo])=>{if(!have.has(name)){S.items.push({id:newId(),vehicleId:vid,name,cycleKm:km,cycleMonths:mo});n++}});
  return n;
}
async function replaceAll(d){
  const g=d.garage||{};const newR=(d.records||[]).filter(r=>r&&r.date&&r.vehicleId).map(r=>{r=clone(r);if(!SAFE_ID.test(String(r.id||'')))r.id=newId();return r});
  applyGarage(g);
  if(mode==='db'){
    toast('가져오는 중…');
    for(const r of R)if(!newR.find(x=>x.id===r.id)){try{await dbRefs.records.doc(r.id).delete()}catch(e){}}
    for(const r of newR){try{await dbRefs.records.doc(r.id).set(r)}catch(e){toast('일부 기록을 저장하지 못했어요');}}
    R=newR;await saveGarage();
  }else{R=newR;lsSave()}
  render();toast(`가져왔어요 · 차량 ${S.vehicles.length}대, 기록 ${R.length}건`);
}

// ---------- events ----------
document.addEventListener('click',async e=>{
  const tb=e.target.closest('#tabbar button');if(tb){location.hash=tb.dataset.tab;return}
  if(e.target.id==='sheetbg'){closeSheet();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,d=el.dataset;
  switch(a){
    case 'close':closeSheet();break;
    case 'go':location.hash=d.t;break;
    case 'cfyes':{const fn=window.__cf;window.__cf=null;closeSheet();if(fn)await fn();break}
    case 'addrec':openSheet(recordForm({kind:d.k||'parts',itemId:d.item}));break;
    case 'kind':{const f=$('#rf');f.className='form k-'+d.k;f.querySelector('[name=kind]').value=d.k;f.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));updSum();break}
    case 'sug':{const i=$('#rf [name=rtitle]');i.value=d.v;const map={'디퍼런셜':'변속기 / 구동계','토크':'변속기 / 구동계','미션':'변속기 / 구동계','등속':'변속기 / 구동계','로어암':'조향 / 현가','쇼크':'조향 / 현가','휠':'조향 / 현가','타이밍':'엔진','인젝터':'엔진','DPF':'엔진','워터':'냉각','알터':'전장','스타트':'전장'};const k=Object.keys(map).find(k=>d.v.startsWith(k));if(k)$('#rf [name=rcat]').value=map[k];break}
    case 'saverec':saveRecordFromForm(!!d.more);break;
    case 'recdetail':recDetail(d.id);break;
    case 'editrec':openSheet(recordForm({record:R.find(x=>x.id===d.id)}));break;
    case 'delrec':confirmSheet('이 기록을 삭제할까요? 삭제하면 되돌릴 수 없어요.','삭제',async()=>{await removeRecord(d.id);render();toast('삭제했어요')});break;
    case 'itemhist':itemHist(d.id);break;

    case 'edititem':itemForm(d.id);break;
    case 'saveitem':{const f=$('#itf'),name=f.name.value.trim(),km=num(f.cycleKm.value),mo=num(f.cycleMonths.value);
      if(!name)return toast('항목 이름을 입력해 주세요');if(!km&&!mo)return toast('교체 주기를 km 또는 개월로 입력해 주세요');
      const ex=S.items.find(i=>i.id===f.dataset.id);
      if(ex){ex.name=name;ex.cycleKm=km;ex.cycleMonths=mo}else S.items.push({id:newId(),vehicleId:V().id,name,cycleKm:km,cycleMonths:mo});
      saveGarage();closeSheet();render();toast('저장했어요');break}
    case 'delitem':confirmSheet('이 소모품 항목을 삭제할까요? 지금까지의 교체 기록은 정비 기록에 남아요.','삭제',()=>{S.items=S.items.filter(i=>i.id!==d.id);saveGarage();render();toast('삭제했어요')});break;
    case 'presets':{const n=addPresets(V().id);if(n){saveGarage();render();toast(`추천 항목 ${n}개를 추가했어요`)}else toast('이미 모두 추가되어 있어요');break}
    case 'odo':openLog();break;
    case 'focusdaily':{location.hash='home';setTimeout(()=>{const i=$('#dkm');if(i){i.scrollIntoView({block:'center'});i.focus()}},50);break}
    case 'savedaily':{const i=$('#dkm');saveLog(today(),num(i&&i.value));break}

    case 'remtoggle':S.reminder=S.reminder||{times:[]};S.reminder.on=!S.reminder.on;saveGarage();render();resyncPush();break;
    case 'addtime':{const t=$('#newtime').value;if(!t)break;S.reminder=S.reminder||{on:true,times:[]};if(!S.reminder.times.includes(t))S.reminder.times.push(t);S.reminder.on=true;saveGarage();render();resyncPush();toast(`${t} 알림을 추가했어요`);break}
    case 'deltime':S.reminder.times=S.reminder.times.filter(x=>x!==d.t);saveGarage();render();resyncPush();break;

    case 'gdisconnect':confirmSheet('구글 드라이브 연결을 해제할까요? 이 휴대폰과 드라이브에 저장된 기록은 그대로 남아요.','연결 해제',()=>{const t=gTok();if(t&&t.t)fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(t.t),{method:'POST',mode:'no-cors'}).catch(()=>{});lsSet(GD_ON,null);lsSet(GD_TOK,null);lsSet(GD_LAST,null);gsync.state='off';render();toast('연결을 해제했어요')});break;
    case 'gcid':{const u=($('#gcid').value||'').trim();lsSet(GD_CID,u||null);render();toast(u?'클라이언트 ID를 저장했어요':'기본값으로 되돌렸어요');break}
    case 'pushoff':confirmSheet('이 휴대폰에서 알림을 끌까요?','끄기',disablePush);break;

const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const GOOGLE_CLIENT_ID=''; // ← Google Cloud OAuth 클라이언트 ID. 예) 1234-abcd.apps.googleusercontent.com
const GD_CID='chagyebu.gClientId',GD_TOK='chagyebu.gTok',GD_ON='chagyebu.gOn',GD_LAST='chagyebu.gLast',GD_AUTO='chagyebu.gAuto';
const GD_NAME='chagyebu-data.json',GD_SCOPE='https://www.googleapis.com/auth/drive.appdata openid email';

function gTok(){try{return JSON.parse(lsGet(GD_TOK,'null'))}catch(e){return null}}
const tokValid=()=>{const t=gTok();return !!(t&&t.t&&t.exp>Date.now())};
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');

// 변경 감지: 바뀐 항목에 수정 시각, 지워진 항목에 삭제 기록을 남겨 두 기기의 기록을 합칠 수 있게 함
function entityMap(){
  const m=new Map();
  S.vehicles.forEach(v=>{const {log,logTs,updatedAt,...rest}=v;m.set('v:'+v.id,JSON.stringify(rest));Object.entries(log||{}).forEach(([d,k])=>m.set('l:'+v.id+':'+d,String(k)))});
  S.items.forEach(i=>{const {updatedAt,...r}=i;m.set('i:'+i.id,JSON.stringify(r))});
  R.forEach(r=>{const {updatedAt,...x}=r;m.set('r:'+r.id,JSON.stringify(x))});
  m.set('s:reminder',JSON.stringify(S.reminder||{}));
  return m;
}
function setTs(k,now){
  const [t,id,d]=k.split(':');
  if(t==='v'){const v=S.vehicles.find(x=>x.id===id);if(v)v.updatedAt=now}
  else if(t==='l'){const v=S.vehicles.find(x=>x.id===id);if(v){v.logTs=v.logTs||{};v.logTs[d]=now}}
  else if(t==='i'){const i=S.items.find(x=>x.id===id);if(i)i.updatedAt=now}
  else if(t==='r'){const r=R.find(x=>x.id===id);if(r)r.updatedAt=now}
  else if(t==='s')S.reminderTs=now;
}
function stamp(){
  const now=Date.now(),m=entityMap();S.deleted=S.deleted||{};
  if(snap){for(const [k,j] of m)if(snap.get(k)!==j){setTs(k,now);delete S.deleted[k]}for(const k of snap.keys())if(!m.has(k)&&k!=='s:reminder')S.deleted[k]=now}
  snap=m;
}
// 두 데이터 합치기: 항목마다 더 나중에 고친 쪽을 남기고, 지운 기록은 반영
function mergeData(A,B){
  const ga=A.garage||{},gb=B.garage||{};
  const del={...(ga.deleted||{})};Object.entries(gb.deleted||{}).forEach(([k,t])=>{if(!(del[k]>=t))del[k]=t});
  const ts=x=>(x&&x.updatedAt)||0,alive=(k,t)=>!(del[k]!=null&&del[k]>=t);
  const pick=(a,b)=>!a?b:!b?a:(ts(b)>ts(a)?b:a);
  const mergeList=(la,lb,p)=>{const m=new Map();(la||[]).forEach(x=>m.set(x.id,x));(lb||[]).forEach(x=>m.set(x.id,pick(m.get(x.id),x)));return [...m.values()].filter(x=>alive(p+x.id,ts(x))).map(clone)};
  const va=new Map((ga.vehicles||[]).map(v=>[v.id,v])),vb=new Map((gb.vehicles||[]).map(v=>[v.id,v]));
  const vehicles=mergeList(ga.vehicles,gb.vehicles,'v:').map(v=>{
    const a=va.get(v.id)||{},b=vb.get(v.id)||{},log={},logTs={};
    new Set([...Object.keys(a.log||{}),...Object.keys(b.log||{})]).forEach(d=>{
      const inA=a.log&&a.log[d]!=null,inB=b.log&&b.log[d]!=null,ta=(a.logTs||{})[d]||0,tb=(b.logTs||{})[d]||0;
      const useA=inA&&(!inB||ta>=tb),val=useA?a.log[d]:b.log[d],t=useA?ta:tb;
      if(alive('l:'+v.id+':'+d,t)){log[d]=val;if(t)logTs[d]=t}
    });
    v.log=log;v.logTs=logTs;const ks=Object.keys(log).sort();if(ks.length&&ks[ks.length-1]>=(v.odoDate||'')){v.odo=log[ks[ks.length-1]];v.odoDate=ks[ks.length-1]}
    return v;
  });
  const ra=ga.reminderTs||0,rb=gb.reminderTs||0;
  return {garage:{vehicles,activeId:ga.activeId||null,items:mergeList(ga.items,gb.items,'i:'),reminder:clone((rb>ra?gb.reminder:ga.reminder)||gb.reminder||{on:true,times:[]}),reminderTs:Math.max(ra,rb),deleted:del},records:mergeList(A.records,B.records,'r:')};
}

// 구글 로그인 (리디렉션 방식: 안드로이드 · 아이폰 홈 화면 앱 모두 같은 창에서 처리)
function gAuth(silent){
  const st=newId();try{sessionStorage.setItem('chagyebu.gState',st);sessionStorage.setItem('chagyebu.gBack',tab())}catch(e){}
  const t=gTok(),p=new URLSearchParams({client_id:gClientId(),redirect_uri:redirectUri(),response_type:'token',scope:GD_SCOPE,include_granted_scopes:'true',state:st});
  if(silent){p.set('prompt','none');if(t&&t.email)p.set('login_hint',t.email)}else p.set('prompt','select_account');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p.toString();
}
let authReturn=null;
(function handleAuthReturn(){
  if(inFrame)return;
  const h=location.hash.slice(1);if(!/(^|&)(access_token|error)=/.test(h))return;
  const p=new URLSearchParams(h);let st='',back='home';try{st=sessionStorage.getItem('chagyebu.gState')||'';back=sessionStorage.getItem('chagyebu.gBack')||'home';sessionStorage.removeItem('chagyebu.gState')}catch(e){}
  history.replaceState(null,'',location.pathname+location.search+'#'+back);
  if(!st||p.get('state')!==st){authReturn='bad-state';return}
  if(p.get('error')){authReturn=p.get('error');return}
  if(!(p.get('scope')||'').includes('drive.appdata')){authReturn='no-scope';return}
  const prev=gTok()||{};
  lsSet(GD_TOK,JSON.stringify({t:p.get('access_token'),exp:Date.now()+((+p.get('expires_in')||3600)-120)*1000,email:prev.email||''}));
  authReturn='ok';
})();

async function gFetch(url,opt={}){
  const t=gTok();const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+(t&&t.t)}});
  if(r.status===401){const x=gTok();if(x){x.exp=0;lsSet(GD_TOK,JSON.stringify(x))}throw {auth:true}}
  if(!r.ok)throw new Error('drive '+r.status+' '+(await r.text().catch(()=>'')).slice(0,200));
  return r;
}
async function gFindFile(){
  const q=encodeURIComponent(`name='${GD_NAME}' and trashed=false`);
  const j=await (await gFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc`)).json();
  return (j.files&&j.files[0])||null;
}
async function gUpload(id,data){
  const body=JSON.stringify(data);
  if(id){await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return id}
  const b='chagyebu'+Date.now(),meta={name:GD_NAME,parents:['appDataFolder'],mimeType:'application/json'};
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  return (await (await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp})).json()).id;
}
async function gEmail(){try{const j=await (await gFetch('https://www.googleapis.com/oauth2/v3/userinfo')).json();const t=gTok();if(t&&j.email){t.email=j.email;lsSet(GD_TOK,JSON.stringify(t))}}catch(e){}}
function canon(x){
  if(Array.isArray(x)){const a=x.map(y=>JSON.parse(canon(y)));if(a.every(y=>y&&typeof y==='object'&&'id' in y))a.sort((p,q)=>String(p.id)<String(q.id)?-1:1);return JSON.stringify(a)}
  if(x&&typeof x==='object'){const o={};Object.keys(x).sort().forEach(k=>{const v=x[k];if(v!==undefined&&!(k==='logTs'&&v&&!Object.keys(v).length))o[k]=JSON.parse(canon(v))});return JSON.stringify(o)}
  return JSON.stringify(x===undefined?null:x);
}
function scheduleSync(){if(!gOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),2500)}
async function syncNow(fromUser){
  if(!gOn())return;
  if(!gClientId()){gsync.state='no-client';return renderSyncUI()}
  if(!tokValid()){if(fromUser)return gAuth(true);gsync.state='need-auth';return renderSyncUI()}
  if(navigator.onLine===false){gsync.state='offline';return renderSyncUI()}
  if(syncing){syncAgain=true;return}
  syncing=true;gsync.state='syncing';renderSyncUI();
  try{
    const f=await gFindFile();let remote=null;
    if(f){remote=await (await gFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json()}
    const local={garage:clone(S),records:clone(R)};
    const mp={...((remote&&remote.photos)||{})};Object.entries(P).forEach(([k,v])=>{if(!mp[k]||(v.ts||0)>(mp[k].ts||0))mp[k]=v});
    let photosChanged=false;if(canon(mp)!==canon(P)){P=mp;try{localStorage.setItem(PH_KEY,JSON.stringify(P))}catch(e){}photosChanged=true}
    const merged=remote&&remote.garage?mergeData(local,remote):{garage:local.garage,records:local.records};
    const cmp=x=>canon({g:{...x.garage,activeId:null},r:x.records||[]});
    if(cmp(merged)!==cmp(local)){
      const act=S.activeId;applyGarage(merged.garage);R=merged.records;
      S.activeId=S.vehicles.find(v=>v.id===act)?act:(S.vehicles[0]?S.vehicles[0].id:null);
      snap=entityMap();lsWrite();
      const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
    }
    if(photosChanged&&cmp(merged)===cmp(local))render();
    if(!remote||cmp(merged)!==cmp(remote)||canon(mp)!==canon(remote.photos||{})){
      const out={app:'my-chagyebu',version:2,syncedAt:new Date().toISOString(),garage:{...merged.garage,activeId:null},records:merged.records,photos:mp};
      await gUpload(f&&f.id,out);
    }
    lsSet(GD_LAST,String(Date.now()));gsync.state='ok';
  }catch(e){console.warn('sync',e);gsync.state=e&&e.auth?'need-auth':'error'}
  syncing=false;renderSyncUI();
  if(syncAgain){syncAgain=false;scheduleSync()}
}
function driveAfterLoad(){
  if(inFrame||mode!=='local')return;
  if(authReturn&&authReturn!=='ok'){
    gsync.state='need-auth';
    if(authReturn==='access_denied')toast('구글 드라이브 권한이 허용되지 않았어요');
    else if(authReturn==='no-scope')toast('드라이브 접근 권한에 체크해 주세요');
  }
  if(!gOn())return renderSyncUI();
  if(tokValid()){if(authReturn==='ok'){gEmail().then(()=>syncNow(false));toast('구글 드라이브에 연결했어요')}else syncNow(false);return}
  // 토큰 만료: 10분에 한 번까지 자동으로 조용히 다시 로그인 (권한이 이미 있으면 화면 없이 바로 돌아옴)
  const last=+lsGet(GD_AUTO,'0');
  if(!authReturn&&navigator.onLine!==false&&Date.now()-last>10*60000&&gClientId()){lsSet(GD_AUTO,String(Date.now()));return gAuth(true)}
  gsync.state='need-auth';renderSyncUI();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&gOn()&&tokValid()&&Date.now()-lastVisSync>60000){lastVisSync=Date.now();syncNow(false)}});
window.addEventListener('online',()=>{if(gOn())syncNow(false)});
const ago=t=>{if(!t)return '아직 없음';const m=Math.round((Date.now()-t)/60000);return m<1?'방금 전':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'};
function syncChip(){
  if(!gOn())return '';
  const st=gsync.state,col={ok:'var(--ok)',syncing:'var(--accent)','need-auth':'var(--warn)',error:'var(--bad)',offline:'var(--dim)','no-client':'var(--warn)'}[st]||'var(--dim)';
  const label={ok:'동기화됨',syncing:'동기화 중','need-auth':'다시 연결 필요',error:'동기화 오류',offline:'오프라인','no-client':'설정 필요'}[st]||'동기화';
  return `<button class="syncb ${st==='syncing'?'spin':''}" id="syncchip" data-a="gsync" aria-label="구글 드라이브 ${label}" title="구글 드라이브 ${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${st==='syncing'?'<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/>':'<path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4 1.5A3.8 3.8 0 0 1 17.5 18z"/>'}</svg><i style="background:${col}"></i></button>`;
}
function driveBox(){
  const cid=gClientId(),t=gTok();
  const cidField=`<details style="margin-top:12px"><summary class="hint" style="cursor:pointer">구글 클라이언트 ID</summary><div class="dinput"><input id="gcid" placeholder="0000-xxxx.apps.googleusercontent.com" value="${esc(lsGet(GD_CID,'')||GOOGLE_CLIENT_ID)}" style="font-size:12.5px"><button class="btn ghost sm" data-a="gcid">저장</button></div></details>`;
  if(mode!=='local')return `<div class="hint" style="margin:0">구글 드라이브 동기화는 설치형 앱에서 쓸 수 있어요.</div>`;
  if(!gOn())return `<div class="gd"><b style="font-size:14.5px">휴대폰을 바꿔도 기록이 그대로</b><div class="hint" style="margin-top:4px">내 구글 드라이브의 앱 전용 숨김 폴더에 자동으로 저장하고, 여러 기기(폴드 · 아이폰 · PC)의 기록을 합쳐서 맞춰 줘요. 드라이브의 다른 파일에는 접근하지 않아요.</div>
   ${cid?`<div class="btns"><button class="btn primary" data-a="gconnect">구글 계정 연결</button></div>`:`<div class="note" style="margin:12px 0 0">구글 클라이언트 ID가 아직 설정되지 않았어요. 아래에 입력하거나 README의 설정 방법을 참고해 주세요.</div>`}${cidField}</div>`;
  const st=gsync.state,msg={ok:'<span style="color:var(--ok)">동기화됨</span>',syncing:'<span style="color:var(--accent)">동기화 중…</span>','need-auth':'<span style="color:var(--warn)">로그인이 만료됐어요. 지금 동기화를 눌러 주세요</span>',error:'<span style="color:var(--bad)">동기화하지 못했어요. 잠시 후 다시 시도해 주세요</span>',offline:'오프라인 · 인터넷에 연결되면 동기화해요','no-client':'<span style="color:var(--warn)">클라이언트 ID가 필요해요</span>'}[st]||'';
  return `<div class="gd"><div class="row"><div style="min-width:0"><b style="font-size:14.5px">구글 드라이브 연결됨</b><div class="acc">${esc((t&&t.email)||'구글 계정')}</div></div></div>
   <div class="hint" style="margin-top:10px">${msg}${msg?' · ':''}마지막 동기화 ${ago(+lsGet(GD_LAST,'0'))}</div>
   <div class="hint">기록을 저장하면 자동으로 드라이브에 올라가고, 앱을 열 때 다른 기기의 변경 사항을 받아와요.</div>
   <div class="btns"><button class="btn primary" data-a="gsync">지금 동기화</button><button class="btn ghost" style="flex:none" data-a="gdisconnect">연결 해제</button></div>${cidField}</div>`;
}
function renderSyncUI(){
  const c=document.getElementById('syncchip');if(c)c.outerHTML=syncChip();
  const g=document.getElementById('gdbox');if(g&&!(document.activeElement&&g.contains(document.activeElement)))g.innerHTML=driveBox();
  if(!c&&gOn()&&ready)render();
}

// ---------- 휴대폰 푸시 알림 (설치형 웹앱 전용) ----------
const PUSH_SERVER=''; // ← 알림 서버(Cloudflare Worker) 주소. 예) https://chagyebu-push.내계정.workers.dev
const PUSH_ID='chagyebu.pushId',PUSH_SRV='chagyebu.pushServer',PUSH_SYNC='chagyebu.pushSync';
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const pushServer=()=>(lsGet(PUSH_SRV,'')||PUSH_SERVER).trim().replace(/\/+$/,'');
const push={state:'checking'};
const b64uToU8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const r=atob(s);return Uint8Array.from(r,c=>c.charCodeAt(0))};
const swReady=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error('sw-timeout')),5000))]);
async function pushApi(path,body){const r=await fetch(pushServer()+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('server '+r.status);return r}
async function checkPush(){
  if(inFrame){push.state='frame';return}
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){push.state=isIOS&&!isStandalone()?'ios-install':'unsupported';return}
  if(!pushServer()){push.state='no-server';return}
  if(Notification.permission==='denied'){push.state='denied';return}
  try{const reg=await swReady();const sub=await reg.pushManager.getSubscription();push.state=sub&&lsGet(PUSH_ID,'')?'on':'off'}catch(e){push.state='off'}
}
function pushPayload(sub){
  const rm=S.reminder||{},v=V();
  return {id:lsGet(PUSH_ID,''),subscription:sub.toJSON(),times:rm.on?(rm.times||[]):[],tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'Asia/Seoul',doneDate:v&&v.log&&v.log[today()]!=null?today():null};
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){push.state=perm==='denied'?'denied':'off';render();return toast('알림 권한이 허용되지 않았어요')}
    const reg=await swReady();
    const key=(await (await fetch(pushServer()+'/vapid')).text()).trim();
    let sub=await reg.pushManager.getSubscription();
    if(sub&&sub.options&&sub.options.applicationServerKey){const cur=new Uint8Array(sub.options.applicationServerKey),want=b64uToU8(key);if(cur.length!==want.length||cur.some((b,i)=>b!==want[i])){await sub.unsubscribe();sub=null}}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)});
    if(!lsGet(PUSH_ID,''))lsSet(PUSH_ID,newId()+newId());
    await pushApi('/subscribe',pushPayload(sub));lsSet(PUSH_SYNC,today());
    push.state='on';render();toast('휴대폰 알림을 켰어요');
  }catch(e){console.warn(e);toast('알림을 켜지 못했어요. 알림 서버 주소를 확인해 주세요')}
}
async function disablePush(){
  const id=lsGet(PUSH_ID,'');
  try{const reg=await swReady();const sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
  try{if(id)await pushApi('/unsubscribe',{id})}catch(e){}
  lsSet(PUSH_ID,null);push.state='off';render();toast('알림을 껐어요');
}
async function resyncPush(){
  if(push.state!=='on')return;
  try{const reg=await swReady();const sub=await reg.pushManager.getSubscription();if(!sub){push.state='off';render();return}await pushApi('/subscribe',pushPayload(sub));lsSet(PUSH_SYNC,today())}catch(e){toast('알림 시간을 서버에 반영하지 못했어요')}
}
function pushDone(date){if(push.state!=='on')return;pushApi('/done',{id:lsGet(PUSH_ID,''),date}).catch(()=>{})}
function pushBlock(){
  const times=((S.reminder&&S.reminder.on&&S.reminder.times)||[]).slice().sort().join(', ');
  const st=push.state;let h='';
  const title='<b style="font-size:14.5px">휴대폰 푸시 알림</b>';
  if(st==='checking')h=`${title}<div class="hint">알림 상태를 확인하는 중…</div>`;
  else if(st==='frame')h=`${title}<div class="hint">휴대폰 푸시 알림은 차계부를 웹앱으로 설치해서 열었을 때 켤 수 있어요.</div>`;
  else if(st==='ios-install')h=`${title}<div class="hint">아이폰은 Safari에서 <b style="color:var(--text)">공유 → 홈 화면에 추가</b>를 한 뒤, 홈 화면의 차계부 아이콘으로 열어야 알림을 켤 수 있어요. (iOS 16.4 이상)</div>`;
  else if(st==='unsupported')h=`${title}<div class="hint">이 브라우저는 푸시 알림을 지원하지 않아요. 안드로이드는 Chrome, 아이폰은 Safari에서 홈 화면에 추가해 주세요.</div>`;
  else if(st==='no-server')h=`${title}<div class="hint">알림 서버 주소가 아직 설정되지 않았어요. 아래 '알림 서버 주소'에 입력해 주세요.</div>`;
  else if(st==='denied')h=`${title}<div class="hint">알림 권한이 차단돼 있어요. 휴대폰 설정 → 알림에서 차계부${isIOS?'':'(또는 Chrome)'} 알림을 허용한 뒤 다시 열어 주세요.</div>`;
  else if(st==='off')h=`<div class="row"><div>${title}<div class="hint" style="margin-top:2px">앱이 닫혀 있어도 설정한 시간에 알림이 와요</div></div></div><div class="btns" style="margin-top:10px"><button class="btn primary" data-a="pushon">이 휴대폰으로 알림 받기</button></div>`;
  else if(st==='on')h=`<div class="row"><div>${title}<div class="hint" style="margin-top:2px;color:var(--ok)">켜짐 · ${times?`매일 ${esc(times)}`:'알림 시간이 없어요'}</div></div></div><div class="hint">오늘 주행거리를 입력하면 그날 남은 알림은 보내지 않아요.</div><div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-a="pushtest">테스트 알림</button><button class="btn danger sm" style="flex:none" data-a="pushoff">끄기</button></div>`;
  if(st!=='frame')h+=`<details style="margin-top:10px"><summary class="hint" style="cursor:pointer">알림 서버 주소</summary><div class="dinput"><input id="pserver" placeholder="https://chagyebu-push.○○.workers.dev" value="${esc(lsGet(PUSH_SRV,'')||PUSH_SERVER)}" style="font-size:13px"><button class="btn ghost sm" data-a="pushserver">저장</button></div></details>`;
  return h;
}
if(!inFrame&&'serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
checkPush().then(()=>{if(tab()==='garage')render();if(push.state==='on'&&lsGet(PUSH_SYNC,'')!==today()){setTimeout(resyncPush,1500)}});
boot();
</script>
